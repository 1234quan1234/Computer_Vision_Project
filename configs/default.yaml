seed: 42

data:
  root: /workspace/VeRi-776/VeRi
  img_size: 320
  batch_size: 64
  p: 16
  k: 4
  time_thresh: 300
  num_workers: 8
  eval_batch_size: 256
  color_jitter: true
  random_erasing: true

model:
  pretrained: true
  use_sem: true
  use_afem: true
  afem_groups: 32
  clip_img_size: 320
  clip_patch_size: 16
  unfreeze_last_blocks: 4

loss:
  label_smoothing: 0.1
  supcon_temp: 0.07
  supcon_weight: 1.0

optim:
  lr: 0.000175
  lr_backbone: 0.0001
  lr_sem: 0.00001
  lr_head: 0.000175
  lr_afem: 0.000175
  weight_decay: 0.0005
  warmup_epochs: 10

train:
  epochs: 70
  eval_period: 10
  log_interval: 50
  grad_clip: 0.5

eval:
  rerank: false
  k1: 20
  k2: 6
  lambda_value: 0.3

output:
  dir: outputs/default
